<div class="modulo-contenedor-principal">
  
  <div class="fila-cabecera">
    <h2 class="titulo-principal">Checador Toluca</h2>
    <button (click)="modoEdicion = !modoEdicion" class="btn-interfaz-azul">
      {{ modoEdicion ? '✖️ CERRAR CONFIGURACIÓN' : '⚙️ GESTIONAR PERSONAL' }}
    </button>
  </div>

  <div *ngIf="modoEdicion" class="panel-edicion-premium">
    <div class="edicion-header">
      <h3 class="subtitulo-seccion">Configuración de Personal</h3>
      <button (click)="agregarRegla()" class="btn-interfaz-verde">+ AGREGAR EMPLEADO</button>
    </div>
    <div class="contenedor-tabla-scroll">
      <table class="tabla-config-personal">
        <thead>
          <tr>
            <th>ID</th><th>Nombre Completo</th><th>Inicio</th><th>Fin</th><th class="txt-center">Activo</th><th class="txt-center">Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let r of reglas">
            <td><input [(ngModel)]="r.id_empleado" class="input-config"></td>
            <td><input [(ngModel)]="r.nombre_completo" class="input-config"></td>
            <td><input [(ngModel)]="r.limite_retardo_inicio" type="time" class="input-config custom-picker"></td>
            <td><input [(ngModel)]="r.limite_retardo_fin" type="time" class="input-config custom-picker"></td>
            <td class="txt-center"><input type="checkbox" [(ngModel)]="r.activo" class="chk-config-gigante"></td>
            <td class="txt-center">
              <div class="acciones-flex">
                <button (click)="actualizarRegla(r)" class="btn-accion-icono">💾</button>
                <button (click)="eliminarRegla(r.id)" class="btn-accion-icono">🗑️</button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="layout-expandido">
    <div class="zona-archivo">
      <input type="file" (change)="onFileChange($event)" id="archivo" style="display: none;">
      <label for="archivo" class="caja-drop-moderna">📂 {{ fileName }}</label>
    </div>
    <div class="zona-fechas-separadas">
      <div class="campo-fecha">
        <label>Inicio:</label>
        <input type="date" [(ngModel)]="fechaInicioStr" class="input-picker custom-picker">
      </div>
      <div class="campo-fecha">
        <label>Finalización:</label>
        <input type="date" [(ngModel)]="fechaFinStr" class="input-picker custom-picker">
      </div>
    </div>
  </div>

  <div class="seccion-acciones-master">
    <button (click)="generarProcesamiento()" class="btn-ejecutar-procesar">PROCESAR ASISTENCIA</button>
    <button *ngIf="resultadosTabla" (click)="exportarExcelResultados()" class="btn-descargar-excel-formateado">DESCARGAR EXCEL</button>
  </div>

  <div *ngIf="resultadosTabla" class="contenedor-resultados-premium">
    <table id="tabla-sec-resultados" class="tabla-asistencia-reporte tabla-con-bordes">
      <thead>
        <tr>
          <th rowspan="2" class="sticky-col">Personal</th>
          <th *ngFor="let dia of diasParaTabla" colspan="3" class="dia-header">{{ dia | date:'dd/MM' }}</th>
        </tr>
        <tr class="sub-headers-frl">
          <ng-container *ngFor="let dia of diasParaTabla">
            <th>F</th><th>R</th><th>L</th>
          </ng-container>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let id of resultadosTabla | keyvalue; let i = index" [class.fila-cebra]="i % 2 === 0">
          <td class="sticky-col name-cell">
            <strong>{{ $any(id.value).nombre }}</strong><br>
            <span class="id-tag">ID: {{ id.key }}</span>
          </td>
          <ng-container *ngFor="let dia of diasParaTabla">
            <td class="col-falta border-cell">{{ obtenerEstado(id.key, dia, 'F') }}</td>
            <td class="col-retardo border-cell">{{ obtenerEstado(id.key, dia, 'R') }}</td>
            <td class="col-limite border-cell">{{ obtenerEstado(id.key, dia, 'L') }}</td>
          </ng-container>
        </tr>
      </tbody>
    </table>
  </div>
</div>
