<div class="login-container">
  <h2 class="login-title">BIENVENIDO</h2>
  <p class="login-subtitle">Plantel: <strong class="sede-text">{{ sedeSeleccionada | uppercase }}</strong></p>

  <div class="form-wrapper">
    <div class="input-group">
      <label>Usuario / Correo</label>
      <input type="text" [(ngModel)]="usuario" placeholder="Ingrese su usuario" [disabled]="cargando" (keyup.enter)="login()">
    </div>

    <div class="input-group">
      <label>Contraseña</label>
      <input type="password" [(ngModel)]="password" placeholder="••••••••" [disabled]="cargando" (keyup.enter)="login()">
    </div>

    <button class="btn-iniciar" (click)="login()" [disabled]="!usuario || !password || cargando">
      <span *ngIf="!cargando">Iniciar sesión</span>
      <span *ngIf="cargando" class="loading-state">
        <span class="spinner-mini"></span> Verificando...
      </span>
    </button>
  </div>
</div>
